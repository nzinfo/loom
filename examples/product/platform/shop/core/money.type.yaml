version: loom-schema/v2
name: Money
form: struct
description: monetary amount with currency
using:
  - shop.core.*
fields:
  - name: amount
    type:
      ref: decimal
      args: { precision: 18, scale: 4 }
    required: true
  - name: currency_code
    type:
      ref: string
      args: { max_length: 3 }
    required: true
