version: loom-schema/v2
entity: entity:shop.core.Customer
strategy: new_table
table: customer_loyalty
group: loyalty
using:
  - shop.core.*
fields:
  - name: points
    type: bigint
    required: true
  - name: tier
    type:
      ref: string
      args: { max_length: 16 }
  - name: enrolled_at
    type: bigint
