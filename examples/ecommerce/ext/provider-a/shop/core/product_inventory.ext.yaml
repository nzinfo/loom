version: loom-schema/v2
entity: entity:shop.core.Product
strategy: sidecar_jsonb
group: inventory
using:
  - shop.core.*
fields:
  - name: sku
    type:
      ref: string
      args: { max_length: 64 }
  - name: stock_qty
    type: bigint
  - name: warehouse
    type:
      ref: string
      args: { max_length: 32 }
